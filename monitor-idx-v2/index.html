body{background:var(--paper);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--ink-text);padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.topbar .sub{font-size:12px;color:var(--ink-muted);margin-top:1px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:inherit}
.iconbtn:active{background:rgba(255,255,255,.08)}
.iconbtn svg{width:22px;height:22px}
.view{display:none;padding:0 0 calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px)}
.view.on{display:block}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);height:calc(var(--nav-h) + env(safe-area-inset-bottom))}
.bottomnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--text-3)}
.bottomnav button svg{width:22px;height:22px}
.bottomnav button .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.bottomnav button[aria-current="page"]{color:var(--text)}
.bottomnav button[aria-current="page"] .pill{background:var(--blue-soft);color:var(--blue)}

/* ---------- hero (signature) ---------- */
.hero{background:var(--ink);color:var(--ink-text);padding:4px 0 22px;border-radius:0 0 28px 28px}
.hero .lede{font-size:22px;font-weight:700;line-height:1.25;letter-spacing:-.015em;margin:6px 0 4px;max-width:30ch}
.hero .lede b{font-weight:800}
.hero .meta{font-size:13px;color:var(--ink-muted)}
.skyline{margin-top:14px;position:relative}
.skyline svg{display:block;width:100%;height:auto;overflow:visible}
.skyline .tick{fill:var(--ink-muted);font-size:10px;font-weight:600}
.skyline .zero{stroke:rgba(255,255,255,.35)}
.skyline .gl{stroke:rgba(255,255,255,.08)}
.skyline .gtx{fill:var(--ink-muted);font-size:10px}
.skyline rect.bar{cursor:pointer}
#skyinfo .hint{font-size:12.5px;color:var(--ink-muted);margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- sections & rows ---------- */
.sec{margin-top:24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 4px 10px}
.sec-h h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.sec-h .link{font-size:13px;font-weight:600;color:var(--blue)}
.sec-note{font-size:13px;color:var(--text-2);margin:-4px 4px 10px}
.group{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--surface-2)}
.tk{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:12.5px;letter-spacing:.01em;background:var(--surface-2);border:1px solid var(--line);position:relative}
.tk i{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--surface)}
.row .mid{flex:1;min-width:0}
.row .t1{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.row .t2{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;flex:none}
.row .big{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.row .small{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.porto{font-size:10.5px;font-weight:700;color:var(--brass);background:var(--brass-soft);border-radius:6px;padding:1px 6px}

/* status chip: icon + label, never color alone */
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px 3px 7px;white-space:nowrap}
.st svg{width:13px;height:13px}
.st.Sehat,.st.Positif,.st.Membaik{color:var(--good);background:var(--good-soft)}
.st.Waspada,.st.Campuran{color:var(--warn);background:var(--warn-soft)}
.st.Tertekan,.st.Negatif,.st.Memburuk{color:var(--bad);background:var(--bad-soft)}
.st.Stagnan,.st.Netral{color:var(--text-2);background:var(--mute-soft)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.tile{background:var(--ink-2);border-radius:14px;padding:10px 10px 9px;text-align:left;color:var(--ink-text)}
.tile .v{font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:11.5px;color:var(--ink-muted);display:flex;align-items:center;gap:5px;margin-top:2px}
.tile[aria-pressed="true"]{outline:2px solid var(--ink-text)}

.scroller{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;padding:0 16px 4px;margin:0 -16px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.spot{flex:0 0 78%;max-width:300px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 14px 6px}
.spot h3{margin:0 0 2px;font-size:14.5px;font-weight:700}
.spot p{margin:0 0 6px;font-size:12.5px;color:var(--text-2)}
.spot .r{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.spot .r b{font-weight:700}
.spot .r span{font-weight:700;font-variant-numeric:tabular-nums}

.q4bar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:10px 0 8px}
.q4bar i{display:block}

/* ---------- emiten list controls ---------- */
.search{position:relative;display:block;margin:16px 0 10px}
.search input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;padding:0 14px 0 42px}
.search svg{position:absolute;left:14px;top:13px;pointer-events:none;width:20px;height:20px;color:var(--text-3)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line-strong);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--surface)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 2px 10px;font-size:13px;color:var(--text-2)}
.select{appearance:none;-webkit-appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font:inherit;font-size:13px;font-weight:600;border-radius:10px;height:34px;padding:0 28px 0 10px;background-image:linear-gradient(45deg,transparent 50%,var(--text-2) 50%),linear-gradient(135deg,var(--text-2) 50%,transparent 50%);background-position:calc(100% - 14px) 15px,calc(100% - 9px) 15px;background-size:5px 5px;background-repeat:no-repeat}
.toolbar .select{flex:1 1 0;min-width:0}
.empty{padding:28px 18px;text-align:center;color:var(--text-2);font-size:14px}

/* ---------- detail sheet ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto;transform:translateX(100%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.sheet.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.dhead{background:var(--ink);color:var(--ink-text);padding:calc(env(safe-area-inset-top) + 8px) 12px 18px}
.dhead .bar{display:flex;align-items:center;justify-content:space-between}
.dtitle{display:flex;align-items:center;gap:14px;padding:6px 6px 0}
.dtitle .code{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.dtitle .name{font-size:14px;color:var(--ink-muted);margin-top:4px}
.dtitle .ring{margin-left:auto;flex:none}
.ring text{fill:var(--ink-text);font-weight:800}
.dbadges{display:flex;gap:8px;flex-wrap:wrap;padding:12px 6px 0}
.dbadges .st{background:rgba(255,255,255,.1)}
.dbadges .st.Sehat,.dbadges .st.Membaik,.dbadges .st.Positif{color:#7fe08f}
.dbadges .st.Waspada,.dbadges .st.Campuran{color:#ffd27a}
.dbadges .st.Tertekan,.dbadges .st.Memburuk,.dbadges .st.Negatif{color:#ff9b91}
.dbadges .st.Stagnan,.dbadges .st.Netral{color:var(--ink-muted)}
.dbadges .porto{background:rgba(217,169,69,.18);color:#f0c66e;font-size:12px;padding:3px 9px;border-radius:999px}
.dkpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 6px 0}
.dkpi div{background:var(--ink-2);border-radius:12px;padding:9px 10px}
.dkpi .l{font-size:11.5px;color:var(--ink-muted)}
.dkpi .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.dkpi .v.pos{color:#7fe08f}.dkpi .v.neg{color:#ff9b91}
.tabs{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:10px 16px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:36px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--text-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.panel{padding:16px 16px 40px;max-width:720px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px;font-weight:700}
.card p{margin:0;line-height:1.55}
.verdict{border-left:4px solid var(--blue)}
.verdict.Sehat{border-left-color:var(--good-fill)}.verdict.Waspada{border-left-color:var(--warn-fill)}.verdict.Tertekan{border-left-color:var(--bad-fill)}.verdict.Stagnan{border-left-color:var(--mute-fill)}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:12px}
.mgrid div{background:var(--surface);padding:11px 14px}
.mgrid .l{font-size:12px;color:var(--text-2)}
.mgrid .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.facts dt{font-size:12.5px;font-weight:700;color:var(--text-2);margin-top:14px}
.facts dt:first-child{margin-top:0}
.facts dd{margin:3px 0 0;line-height:1.55}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);line-height:1.5}
.list li:first-child{border-top:0;padding-top:2px}
.list li svg{flex:none;width:18px;height:18px;margin-top:2px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--text-2)}
.kv span:last-child{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.note{font-size:13px;color:var(--text-2);line-height:1.55}
.src a{display:block;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;word-break:break-word;text-decoration:none}
.src a:first-of-type{border-top:0}
.src a small{display:block;color:var(--text-2);font-size:12px}

/* ---------- charts ---------- */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--text-2);font-size:11px;font-family:var(--font)}
.chart .lab{fill:var(--text);font-weight:600}
.chart .gl{stroke:var(--grid)}
.chart .ax{stroke:var(--axis)}
.chart .ref{stroke:var(--axis);stroke-dasharray:4 3}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--surface);color:var(--text);border:1px solid var(--line-strong);box-shadow:0 6px 20px rgba(10,20,40,.16);border-radius:10px;padding:7px 10px;font-size:12.5px;line-height:1.4;max-width:240px}
.tip b{font-weight:800}
.ch-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--text-2);margin-top:8px}
.ch-legend span{display:inline-flex;align-items:center;gap:6px}

.heat{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.heat th{font-size:11.5px;font-weight:700;color:var(--text-2);text-align:right;padding:6px 6px;position:sticky;top:0;background:var(--surface)}
.heat th:first-child,.heat td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.heat td{text-align:right;padding:8px 6px;border-top:1px solid var(--line)}
.heat td.c{border-radius:0}
.heat tr{cursor:pointer}
.hwrap{overflow-x:auto}

/* ---------- about sheet ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,14,26,.5);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .box{background:var(--surface);width:100%;max-width:720px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 24px)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:4px auto 14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin:8px 0 18px}
.seg button{height:34px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.box h2{font-size:18px;margin:0 0 4px}
.box h3{font-size:14.5px;margin:18px 0 6px}
.box p,.box li{font-size:14px;line-height:1.55;color:var(--text)}
.box ul{padding-left:18px;margin:6px 0}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:760px){.spot{flex-basis:300px}.tiles{gap:12px}}
</style>

    if (v < 0 && x(v) - 6 - vw < m.l) { vt.setAttribute('x', x(v) + 6); vt.setAttribute('text-anchor', 'start'); vt.setAttribute('style', 'fill:#fff;font-weight:700'); }

}

/* ---------- detail ---------- */
const DTABS = [['ringkasan', 'Ringkasan'], ['kinerja', 'Kinerja'], ['dividen', 'Dividen'], ['proyek', 'Proyek Q4'], ['sumber', 'Sumber']];

    P.innerHTML = `<div class="card verdict ${esc(r.status)}"><h3>Penilaian</h3><p>${T(r.verdict)}</p></div>
      <div class="mgrid">${m.map(([l, v]) => `<div><div class="l">${l}</div><div class="v">${v}</div></div>`).join('')}</div>
      <p class="note" style="margin:-4px 4px 14px">Periode ${esc(r.periode)}, satuan ${esc(r.satuan)}. Valuasi per ${tgl(r.tgl_valuasi)}. Skor fundamental ${r.skor}/100.</p>
      <div class="card"><dl class="facts" style="margin:0">
        <dt>Inti bisnis</dt><dd>${T(r.bisnis)}</dd><dt>Ekspansi</dt><dd>${T(r.ekspansi)}</dd><dt>Utang &amp; risiko terhadap laba</dt><dd>${T(r.utang)}</dd>
        <dt>Tantangan</dt><dd>${T(r.tantangan)}</dd><dt>Prospek</dt><dd>${T(r.prospek)}</dd></dl></div>`;
  } else if (tab === 'kinerja') {
    const g = r.pg, li = (k, icn, col) => [1, 2, 3].map((i) => g[k + i]).filter(Boolean).map((t) => `<li><span style="color:${col}">${ic(icn)}</span><span>${T(t)}</span></li>`).join('');
    P.innerHTML = `<div class="card"><div style="margin-bottom:8px">${chip(g.arah)}</div><p>${T(g.ringkas)}</p></div>
      <div class="card"><h3>Pendorong kinerja</h3><ul class="list">${li('naik_', 'up', 'var(--good)')}</ul></div>

        <div class="kv"><span>FCF yield ÷ dividend yield</span><span class="${isNum(r.cover) ? (r.cover >= 1 ? 'pos' : 'neg') : ''}">${isNum(r.cover) ? fmt(r.cover, 2) + 'x' : 'n/a'}</span></div>

        <div class="kv"><span>Free cash flow</span><span class="${pc(k.fcf)}">${fmt(k.fcf, 0)}</span></div><div class="kv"><span>FCF FY2025</span><span class="${pc(k.fcf_fy2025)}">${fmt(k.fcf_fy2025, 0)}</span></div>

function drawDivChart(r) {
  const host = $('#dchart'); const cols = YEARS.map((y) => ({ k: y, v: r.piv.y[y] ? r.piv.y[y].v : null, p: r.piv.y[y] ? r.piv.y[y].p : null })).concat([{ k: 'Kini', v: r.piv.kini, p: r.piv.payout }]);
  const H = 190, { W, svg, tip } = chartFrame(host, H, 'Dividend yield ' + r.kode + ' per tahun');
  const m = { l: 32, r: 6, t: 18, b: 24 }, mx = Math.max(5, ...cols.map((c) => c.v || 0)) * 1.12;
  const step = (W - m.l - m.r) / cols.length, bw = Math.min(34, step * 0.6), y = (v) => H - m.b - v / mx * (H - m.t - m.b);
  const tstep = mx > 20 ? 10 : 5;
  for (let v = 0; v <= mx; v += tstep) { el('line', { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), class: v ? 'gl' : 'ax' }, svg); el('text', { x: m.l - 6, y: y(v), dy: '.35em', 'text-anchor': 'end' }, svg).textContent = v + '%'; }
  cols.forEach((c, i) => {
    const cx = m.l + i * step + step / 2;
    el('text', { x: cx, y: H - 6, 'text-anchor': 'middle' }, svg).textContent = c.k === 'Kini' ? 'Terbaru' : c.k;
    if (!isNum(c.v)) { el('text', { x: cx, y: y(0) - 6, 'text-anchor': 'middle' }, svg).textContent = '–'; return; }
    const g = el('g', { style: 'cursor:pointer' }, svg);
    el('rect', { x: cx - step / 2, y: m.t, width: step, height: H - m.t - m.b, fill: 'transparent' }, g);
    el('path', { d: barPath(cx - bw / 2, y(c.v), bw, y(0) - y(c.v), 4), fill: c.k === 'Kini' ? 'var(--brass)' : 'var(--blue)' }, g);
    el('text', { x: cx, y: y(c.v) - 5, 'text-anchor': 'middle', class: 'lab' }, svg).textContent = fmt(c.v, 1);
    g.addEventListener('click', () => tipAt(host, tip, cx * host.clientWidth / W, y(c.v) * host.clientWidth / W, `<b>${c.k === 'Kini' ? 'Terbaru' : c.k}</b> yield ${fmt(c.v, 2)}%<br>Payout ${isNum(c.p) ? fmt(c.p, 1) + '%' : 'n/a'}`));
  });
}
const barPath = (x, y, w, h, r) => { r = Math.min(r, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };

/* ---------- router ---------- */
const TABS = ['home', 'emiten', 'q4', 'analitik'];
let lastTab = 'home';
function parse() { const h = location.hash.replace(/^#\/?/, '').split('/'); return h[0] === 'e' ? { detail: h[1], tab: h[2] || 'ringkasan' } : { tab: TABS.includes(h[0]) ? h[0] : 'home' }; }
function route() {
  const p = parse(); const sheet = $('#sheet');
  if (p.detail && R[p.detail]) {
    renderDetail(p.detail, DTABS.some((t) => t[0] === p.tab) ? p.tab : 'ringkasan');
    if (!sheet.classList.contains('on')) { sheet.classList.add('on'); sheet.scrollTop = 0; }
    document.body.style.overflow = 'hidden';
    return;
  }
  sheet.classList.remove('on'); document.body.style.overflow = ''; cur = null;
  if (p.tab !== lastTab) window.scrollTo(0, 0);
  lastTab = p.tab;
  TABS.forEach((t) => $('#v-' + t).classList.toggle('on', t === p.tab));
  document.querySelectorAll('.bottomnav [data-nav]').forEach((b) => b.toggleAttribute('aria-current', false) || (b.dataset.nav === p.tab && b.setAttribute('aria-current', 'page')));
  if (p.tab === 'emiten') renderEmitenList();
  if (p.tab === 'analitik') drawAnalyticsCharts();
  if (p.tab === 'home') drawSkyline();
}
function openDetail(kode, tab) { location.hash = `#/e/${kode}/${tab || 'ringkasan'}`; }

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-open],[data-nav],[data-st],[data-porto],[data-q4],[data-dtab],[data-goto-status],[data-theme-pick],#btn-about,#about');
  if (!t) return;
  if (t.id === 'btn-about') { $('#about').classList.add('on'); return; }
  if (t.id === 'about') { if (e.target === t) t.classList.remove('on'); return; }
  if (t.dataset.themePick) { store.set('theme', t.dataset.themePick); applyTheme(); return; }
  if (t.dataset.open) { openDetail(t.dataset.open, t.dataset.tab); return; }
  if (t.dataset.nav) { location.hash = '#/' + t.dataset.nav; return; }
  if (t.dataset.dtab) { const p = parse(); history.replaceState(null, '', `#/e/${p.detail}/${t.dataset.dtab}`); renderDetail(p.detail, t.dataset.dtab); $('#sheet').scrollTo({ top: Math.min($('#sheet').scrollTop, $('.dhead').offsetHeight), behavior: 'instant' }); return; }
  if (t.dataset.gotoStatus) { S.status = t.dataset.gotoStatus; location.hash = '#/emiten'; return; }
  if ('st' in t.dataset) { S.status = t.dataset.st; renderEmitenList(); return; }
  if ('porto' in t.dataset) { S.porto = !S.porto; renderEmitenList(); return; }
  if ('q4' in t.dataset) { S.q4 = t.dataset.q4; renderQ4(); return; }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('#about').classList.contains('on')) $('#about').classList.remove('on'); else if ($('#sheet').classList.contains('on')) history.back(); } });
let rw = window.innerWidth, rt;
window.addEventListener('resize', () => { if (Math.abs(window.innerWidth - rw) < 30) return; rw = window.innerWidth; clearTimeout(rt); rt = setTimeout(() => { drawSkyline(); drawAnalyticsCharts(); const p = parse(); if (p.detail && p.tab === 'dividen') drawDivChart(R[p.detail]); }, 150); });
window.addEventListener('hashchange', route);

/* ---------- boot ---------- */
applyTheme(); renderHome(); renderEmitenShell(); renderQ4(); renderAnalytics(); renderAbout(); route();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
})();
</script>
